name: Mantener las apps despiertas

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón «Run workflow» para lanzarlo a mano

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar el navegador
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visitar las apps
        run: python .github/scripts/despertar_apps.py
